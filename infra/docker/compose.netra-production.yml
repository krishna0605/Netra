name: netra-production

x-production-env: &production-env
  environment:
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-0}
    DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-0}
    SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF is required}
    SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
    SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
    NETRA_DATABASE_PROVIDER: supabase
    NETRA_DEPLOYMENT_PROFILE: ${NETRA_DEPLOYMENT_PROFILE:-hackathon-core}
    NETRA_FREE_PLAN_GUARD: ${NETRA_FREE_PLAN_GUARD:-1}
    NETRA_DATABASE_MODE: supabase
    NETRA_STORAGE_PROVIDER: supabase
    NETRA_QUEUE_PROVIDER: postgres-row-lock
    NETRA_REALTIME_PROVIDER: ${NETRA_REALTIME_PROVIDER:-sse}
    NETRA_AUTH_PROVIDER: supabase
    NETRA_ACCESS_MODE: bearer
    NETRA_DEV_ROLE_HEADERS: "0"
    NETRA_SEARCH_PROVIDER: postgres
    NETRA_PROCESSING_MODE: postgres-worker
    NETRA_SYNC_FALLBACK_ENABLED: "0"
    NETRA_STORAGE_ROOT: /app/storage
    NETRA_EVIDENCE_ENCRYPTION: "on"
    NETRA_EVIDENCE_KEY: ${NETRA_EVIDENCE_KEY:?NETRA_EVIDENCE_KEY is required}
    NETRA_EVIDENCE_KEY_ID: ${NETRA_EVIDENCE_KEY_ID:?NETRA_EVIDENCE_KEY_ID is required}
    NETRA_SENSOR_SHARED_KEY: ${NETRA_SENSOR_SHARED_KEY:?NETRA_SENSOR_SHARED_KEY is required}
    NETRA_ENABLE_STRUCTURED_IMPORTS: ${NETRA_ENABLE_STRUCTURED_IMPORTS:-0}
    NETRA_ENABLE_INTEGRATIONS: ${NETRA_ENABLE_INTEGRATIONS:-0}
    NETRA_WEBHOOK_ALLOWED_HOSTS: ${NETRA_WEBHOOK_ALLOWED_HOSTS:-}
    NETRA_MAX_UPLOAD_MB: ${NETRA_MAX_UPLOAD_MB:-25}
    NETRA_DIRECT_UPLOAD_ENABLED: ${NETRA_DIRECT_UPLOAD_ENABLED:-0}
    NETRA_DIRECT_UPLOAD_MAX_MB: ${NETRA_DIRECT_UPLOAD_MAX_MB:-25}
    NETRA_STORAGE_DEEP_HEALTHCHECK: ${NETRA_STORAGE_DEEP_HEALTHCHECK:-0}
    NETRA_WORKER_MAX_RETRIES: ${NETRA_WORKER_MAX_RETRIES:-3}
    NETRA_FRONTEND_ORIGINS: ${NETRA_FRONTEND_ORIGINS:?NETRA_FRONTEND_ORIGINS is required}
    NETRA_DEPLOYMENT_ENV: production
    NETRA_PUBLIC_BASE_URL: ${NETRA_PUBLIC_BASE_URL:?NETRA_PUBLIC_BASE_URL is required}
    NETRA_REQUIRE_HTTPS: ${NETRA_REQUIRE_HTTPS:-0}
    NETRA_RELEASE_ID: ${NETRA_RELEASE_ID:?NETRA_RELEASE_ID is required}
    NETRA_RUNTIME_ROLE: api

services:
  frontend:
    image: netra-production-frontend:${NETRA_RELEASE_ID:?NETRA_RELEASE_ID is required}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?VITE_SUPABASE_PUBLISHABLE_KEY is required}
    ports:
      - "${NETRA_HTTP_BIND:-0.0.0.0}:8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: netra-production-backend:${NETRA_RELEASE_ID:?NETRA_RELEASE_ID is required}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    <<: *production-env
    command: sh -c "python manage.py check --deploy && python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${NETRA_GUNICORN_WORKERS:-2} --timeout ${NETRA_GUNICORN_TIMEOUT:-240}"
    expose:
      - "8000"
    volumes:
      - netra-production-storage:/app/storage
    restart: unless-stopped

  analysis-worker:
    image: netra-production-worker:${NETRA_RELEASE_ID:?NETRA_RELEASE_ID is required}
    build:
      context: ../..
      dockerfile: backend/Dockerfile.worker
    <<: *production-env
    command: sh -c "export NETRA_RUNTIME_ROLE=worker; exec python manage.py run_postgres_worker"
    volumes:
      - netra-production-storage:/app/storage
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - workers

volumes:
  netra-production-storage:
