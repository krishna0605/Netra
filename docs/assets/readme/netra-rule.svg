<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="1200" height="8" role="presentation" aria-hidden="true">
  <title>Section divider</title>
  <defs>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fa6c34" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#fa6c34" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a73" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect x="0" y="3.4" width="1200" height="1.2" rx="0.6" fill="#8a8a8a" fill-opacity="0.34"/>

  <rect y="3.1" width="230" height="1.8" rx="0.9" fill="url(#comet)">
    <animate attributeName="x" from="-230" to="1200" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <circle cy="4" r="2.2" fill="#ff9a73">
    <animate attributeName="cx" from="0" to="1430" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.92;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>
