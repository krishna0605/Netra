<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Animated Netra evidence pipeline: packets stream left to right through six stages — capture, preserve, decode, detect, investigate, report — lighting each stage as they pass.">
  <title>Netra evidence pipeline</title>
  <desc>Decorative animation of the same six stages described in the pipeline table below: capture or upload, preserve, decode, detect, investigate, report.</desc>

  <defs>
    <filter id="pkGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="railFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fa6c34" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fa6c34" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fa6c34" stop-opacity="0"/>
    </linearGradient>

    <style>
      .mono {
        font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
      }
      .head    { fill: #10110F; fill-opacity: 0.66; font-size: 14px; letter-spacing: 3.4px; }
      .headAlt { fill: #10110F; fill-opacity: 0.45; font-size: 11px; letter-spacing: 1.7px; }
      .stage   { fill: #10110F; font-size: 14px; letter-spacing: 2px; }
      .stageSub{ fill: #10110F; fill-opacity: 0.55; font-size: 10px; letter-spacing: 0.9px; }
      .foot    { fill: #10110F; fill-opacity: 0.45; font-size: 11px; letter-spacing: 1.3px; }
      .rule    { stroke: #10110F; stroke-opacity: 0.14; }
      .node    { fill: #e9e0d1; stroke: #10110F; stroke-opacity: 0.18; stroke-width: 1; }
      .chev    { fill: none; stroke: #10110F; stroke-opacity: 0.32; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

      .hit { opacity: 0; animation: hit 1.2s linear infinite; }
      @keyframes hit {
        0%        { opacity: 1; }
        14%       { opacity: 0.7; }
        55%, 100% { opacity: 0; }
      }
      .d1 { animation-delay: -0.734s; }
      .d2 { animation-delay: -0.921s; }
      .d3 { animation-delay: -1.107s; }
      .d4 { animation-delay: -0.093s; }
      .d5 { animation-delay: -0.280s; }
      .d6 { animation-delay: -0.466s; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0.75" y="0.75" width="1198.5" height="228.5" rx="20" fill="#f0e8da" stroke="#10110F" stroke-opacity="0.16"/>

  <!-- header -->
  <text class="mono head" x="36" y="37">EVIDENCE PIPELINE</text>
  <text class="mono headAlt" x="1164" y="37" text-anchor="end">CASE-SCOPED · WORKER-ISOLATED · INVESTIGATOR-REVIEWED</text>
  <line class="rule" x1="36" y1="52" x2="1164" y2="52"/>

  <!-- transport rail and packets, drawn behind the opaque stage cards -->
  <rect x="14" y="112" width="1172" height="12" fill="url(#railFade)"/>
  <line x1="14" y1="118" x2="1186" y2="118" stroke="#10110F" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="2 7">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <g filter="url(#pkGlow)">
    <circle cy="118" r="3.8" fill="#de5d35">
      <animate attributeName="cx" from="14" to="1186" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cy="118" r="3.8" fill="#de5d35">
      <animate attributeName="cx" from="14" to="1186" dur="6s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="6s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cy="118" r="3.8" fill="#de5d35">
      <animate attributeName="cx" from="14" to="1186" dur="6s" begin="-2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="6s" begin="-2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cy="118" r="3.8" fill="#de5d35">
      <animate attributeName="cx" from="14" to="1186" dur="6s" begin="-3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="6s" begin="-3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cy="118" r="3.8" fill="#de5d35">
      <animate attributeName="cx" from="14" to="1186" dur="6s" begin="-4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="6s" begin="-4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- flow chevrons -->
  <g class="chev">
    <path d="M200,112 L208,118 L200,124"/>
    <path d="M398,112 L406,118 L398,124"/>
    <path d="M596,112 L604,118 L596,124"/>
    <path d="M794,112 L802,118 L794,124"/>
    <path d="M992,112 L1000,118 L992,124"/>
  </g>

  <!-- stages -->
  <g>
    <rect class="node" x="26" y="82" width="158" height="70" rx="16"/>
    <text class="mono stage" x="105" y="112" text-anchor="middle">CAPTURE</text>
    <text class="mono stageSub" x="105" y="134" text-anchor="middle">PCAP / PCAPNG</text>
    <g class="hit d1">
      <rect x="26" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="81" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="224" y="82" width="158" height="70" rx="16"/>
    <text class="mono stage" x="303" y="112" text-anchor="middle">PRESERVE</text>
    <text class="mono stageSub" x="303" y="134" text-anchor="middle">hash · encrypt</text>
    <g class="hit d2">
      <rect x="224" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="279" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="422" y="82" width="158" height="70" rx="16"/>
    <text class="mono stage" x="501" y="112" text-anchor="middle">DECODE</text>
    <text class="mono stageSub" x="501" y="134" text-anchor="middle">packets · protocols</text>
    <g class="hit d3">
      <rect x="422" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="477" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="620" y="82" width="158" height="70" rx="16"/>
    <text class="mono stage" x="699" y="112" text-anchor="middle">DETECT</text>
    <text class="mono stageSub" x="699" y="134" text-anchor="middle">rules · anomalies</text>
    <g class="hit d4">
      <rect x="620" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="675" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="818" y="82" width="158" height="70" rx="16"/>
    <text class="mono stage" x="897" y="112" text-anchor="middle">INVESTIGATE</text>
    <text class="mono stageSub" x="897" y="134" text-anchor="middle">sessions · graph</text>
    <g class="hit d5">
      <rect x="818" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="873" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="1016" y="82" width="158" height="70" rx="16"/>
    <text class="mono stage" x="1095" y="112" text-anchor="middle">REPORT</text>
    <text class="mono stageSub" x="1095" y="134" text-anchor="middle">findings · exports</text>
    <g class="hit d6">
      <rect x="1016" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="1071" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <!-- footer -->
  <line class="rule" x1="36" y1="184" x2="1164" y2="184"/>
  <text class="mono foot" x="36" y="207">Authorized captures only · detections are investigator-reviewed signals, not legal conclusions</text>
  <text class="mono foot" x="1164" y="207" text-anchor="end">DETERMINISTIC</text>
</svg>
