<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Animated Netra authorization chain: every request passes five declared gates in order — authenticate, scope, capability, assurance, rate — before reaching a route handler.">
  <title>Netra request authorization chain</title>
  <desc>Decorative animation of the five policy dimensions declared for every route in backend/apps/forensics/route_policies.py: authentication, scope, capability, assurance level, and rate category.</desc>

  <defs>
    <filter id="rqGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="authRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fa6c34" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fa6c34" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fa6c34" stop-opacity="0"/>
    </linearGradient>

    <style>
      .mono {
        font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
      }
      .head    { fill: #10110F; fill-opacity: 0.66; font-size: 14px; letter-spacing: 3.4px; }
      .headAlt { fill: #10110F; fill-opacity: 0.45; font-size: 11px; letter-spacing: 1.7px; }
      .gate    { fill: #10110F; font-size: 14px; letter-spacing: 2px; }
      .gateSub { fill: #10110F; fill-opacity: 0.55; font-size: 10px; letter-spacing: 0.9px; }
      .foot    { fill: #10110F; fill-opacity: 0.45; font-size: 11px; letter-spacing: 1.3px; }
      .rule    { stroke: #10110F; stroke-opacity: 0.14; }
      .node    { fill: #e9e0d1; stroke: #10110F; stroke-opacity: 0.18; stroke-width: 1; }
      .bar     { stroke: #10110F; stroke-opacity: 0.3; stroke-width: 1.8; stroke-linecap: round; }

      .hit { opacity: 0; animation: hit 2s linear infinite; }
      @keyframes hit {
        0%        { opacity: 1; }
        8%        { opacity: 0.7; }
        33%, 100% { opacity: 0; }
      }
      .g1 { animation-delay: -1.534s; }
      .g2 { animation-delay: -0.521s; }
      .g3 { animation-delay: -1.507s; }
      .g4 { animation-delay: -0.493s; }
      .g5 { animation-delay: -1.480s; }
      .g6 { animation-delay: -0.466s; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0.75" y="0.75" width="1198.5" height="228.5" rx="20" fill="#f0e8da" stroke="#10110F" stroke-opacity="0.16"/>

  <!-- header -->
  <text class="mono head" x="36" y="37">REQUEST AUTHORIZATION</text>
  <text class="mono headAlt" x="1164" y="37" text-anchor="end">DERIVED PER ROUTE · MACHINE-CHECKED · FAIL CLOSED</text>
  <line class="rule" x1="36" y1="52" x2="1164" y2="52"/>

  <!-- request rail, behind the opaque gate cards -->
  <rect x="14" y="112" width="1172" height="12" fill="url(#authRail)"/>
  <line x1="14" y1="118" x2="1186" y2="118" stroke="#10110F" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="2 7">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
  </line>

  <g filter="url(#rqGlow)">
    <circle cy="118" r="3.8" fill="#de5d35">
      <animate attributeName="cx" from="14" to="1186" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cy="118" r="3.8" fill="#de5d35">
      <animate attributeName="cx" from="14" to="1186" dur="6s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cy="118" r="3.8" fill="#de5d35">
      <animate attributeName="cx" from="14" to="1186" dur="6s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="6s" begin="-4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- gate bars between stages -->
  <g class="bar">
    <line x1="204" y1="108" x2="204" y2="128"/>
    <line x1="402" y1="108" x2="402" y2="128"/>
    <line x1="600" y1="108" x2="600" y2="128"/>
    <line x1="798" y1="108" x2="798" y2="128"/>
    <line x1="996" y1="108" x2="996" y2="128"/>
  </g>

  <!-- gates -->
  <g>
    <rect class="node" x="26" y="82" width="158" height="70" rx="16"/>
    <text class="mono gate" x="105" y="112" text-anchor="middle">AUTHENTICATE</text>
    <text class="mono gateSub" x="105" y="134" text-anchor="middle">ES256 · JWKS</text>
    <g class="hit g1">
      <rect x="26" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="81" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="224" y="82" width="158" height="70" rx="16"/>
    <text class="mono gate" x="303" y="112" text-anchor="middle">SCOPE</text>
    <text class="mono gateSub" x="303" y="134" text-anchor="middle">org · case · job</text>
    <g class="hit g2">
      <rect x="224" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="279" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="422" y="82" width="158" height="70" rx="16"/>
    <text class="mono gate" x="501" y="112" text-anchor="middle">CAPABILITY</text>
    <text class="mono gateSub" x="501" y="134" text-anchor="middle">feature gate</text>
    <g class="hit g3">
      <rect x="422" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="477" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="620" y="82" width="158" height="70" rx="16"/>
    <text class="mono gate" x="699" y="112" text-anchor="middle">ASSURANCE</text>
    <text class="mono gateSub" x="699" y="134" text-anchor="middle">AAL1 · AAL2</text>
    <g class="hit g4">
      <rect x="620" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="675" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="818" y="82" width="158" height="70" rx="16"/>
    <text class="mono gate" x="897" y="112" text-anchor="middle">RATE</text>
    <text class="mono gateSub" x="897" y="134" text-anchor="middle">atomic bucket</text>
    <g class="hit g5">
      <rect x="818" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="873" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <g>
    <rect class="node" x="1016" y="82" width="158" height="70" rx="16"/>
    <text class="mono gate" x="1095" y="112" text-anchor="middle">HANDLER</text>
    <text class="mono gateSub" x="1095" y="134" text-anchor="middle">183 routes</text>
    <g class="hit g6">
      <rect x="1016" y="82" width="158" height="70" rx="16" fill="none" stroke="#fa6c34" stroke-width="1.8"/>
      <rect x="1071" y="144" width="48" height="2.6" rx="1.3" fill="#fa6c34"/>
    </g>
  </g>

  <!-- footer -->
  <line class="rule" x1="36" y1="184" x2="1164" y2="184"/>
  <text class="mono foot" x="36" y="207">Every route carries a derived policy · anything not explicitly anonymous requires a verified bearer token</text>
  <text class="mono foot" x="1164" y="207" text-anchor="end">ORDERED</text>
</svg>
