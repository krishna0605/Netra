<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 260" width="230" height="260" role="img" aria-label="Animated Netra signal scope: a radar sweep rotating over concentric rings while detection blips resolve and fade.">
  <title>Netra signal scope</title>
  <desc>Decorative animation. A rotating sweep passes over a ring grid and lights detection blips in sequence.</desc>

  <defs>
    <radialGradient id="sweepFade" gradientUnits="userSpaceOnUse" cx="115" cy="142" r="82">
      <stop offset="0" stop-color="#fa6c34" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#fa6c34" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fa6c34" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="scopeVignette" gradientUnits="userSpaceOnUse" cx="115" cy="142" r="112">
      <stop offset="0" stop-color="#fa6c34" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fa6c34" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="scopeClip">
      <circle cx="115" cy="142" r="82"/>
    </clipPath>

    <style>
      .mono {
        font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
      }
      .label { fill: #10110F; fill-opacity: 0.62; font-size: 10.5px; letter-spacing: 1.9px; }
      .micro { fill: #10110F; fill-opacity: 0.48; font-size: 9.5px; letter-spacing: 1.5px; }
      .grid  { stroke: #10110F; stroke-opacity: 0.15; fill: none; }
      .rule  { stroke: #10110F; stroke-opacity: 0.14; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0.75" y="0.75" width="228.5" height="258.5" rx="20" fill="#f0e8da" stroke="#10110F" stroke-opacity="0.16"/>
  <circle cx="115" cy="142" r="112" fill="url(#scopeVignette)"/>

  <!-- header -->
  <text class="mono label" x="18" y="28">SIGNAL SCOPE</text>
  <text class="mono micro" x="200" y="28" text-anchor="end">LIVE</text>
  <circle cx="212" cy="24.5" r="3.2" fill="#fa6c34"/>
  <circle cx="212" cy="24.5" r="3.2" fill="none" stroke="#fa6c34" stroke-width="1.2">
    <animate attributeName="r" values="3.2;10.5" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.9;0" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <line class="rule" x1="18" y1="40" x2="212" y2="40"/>

  <!-- ring grid -->
  <g class="grid">
    <circle cx="115" cy="142" r="20"/>
    <circle cx="115" cy="142" r="42"/>
    <circle cx="115" cy="142" r="64"/>
    <circle cx="115" cy="142" r="82" stroke-opacity="0.26"/>
    <line x1="33" y1="142" x2="197" y2="142"/>
    <line x1="115" y1="60" x2="115" y2="224"/>
  </g>

  <!-- bearing ticks -->
  <g stroke="#10110F" stroke-opacity="0.3" stroke-width="1.4" stroke-linecap="round">
    <line x1="115" y1="55" x2="115" y2="61"/>
    <line x1="115" y1="223" x2="115" y2="229"/>
    <line x1="28" y1="142" x2="34" y2="142"/>
    <line x1="196" y1="142" x2="202" y2="142"/>
    <line x1="176.8" y1="80.2" x2="181.1" y2="75.9"/>
    <line x1="53.2" y1="203.8" x2="48.9" y2="208.1"/>
    <line x1="176.8" y1="203.8" x2="181.1" y2="208.1"/>
    <line x1="53.2" y1="80.2" x2="48.9" y2="75.9"/>
  </g>

  <!-- rotating sweep -->
  <g clip-path="url(#scopeClip)">
    <g>
      <path d="M115,142 L115,60 A82,82 0 0 1 182.2,95 Z" fill="url(#sweepFade)"/>
      <line x1="115" y1="142" x2="115" y2="60" stroke="#de5d35" stroke-opacity="0.9" stroke-width="1.6"/>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                        from="0 115 142" to="360 115 142" dur="4.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- detection blips, phased to the sweep -->
  <g>
    <g>
      <circle cx="152" cy="110" r="0" fill="#de5d35" opacity="0">
        <animate attributeName="r" values="0;4.4;3.1;3.1;0" keyTimes="0;0.04;0.12;0.74;1" dur="4.2s" begin="0.57s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0.16;0" keyTimes="0;0.04;0.14;0.82;1" dur="4.2s" begin="0.57s" repeatCount="indefinite"/>
      </circle>
      <circle cx="152" cy="110" r="3" fill="none" stroke="#fa6c34" stroke-width="1.2" opacity="0">
        <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="0.57s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0;0" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="0.57s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="172" cy="168" r="0" fill="#de5d35" opacity="0">
        <animate attributeName="r" values="0;4.4;3.1;3.1;0" keyTimes="0;0.04;0.12;0.74;1" dur="4.2s" begin="1.34s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0.16;0" keyTimes="0;0.04;0.14;0.82;1" dur="4.2s" begin="1.34s" repeatCount="indefinite"/>
      </circle>
      <circle cx="172" cy="168" r="3" fill="none" stroke="#fa6c34" stroke-width="1.2" opacity="0">
        <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="1.34s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0;0" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="1.34s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="124" cy="196" r="0" fill="#de5d35" opacity="0">
        <animate attributeName="r" values="0;4.4;3.1;3.1;0" keyTimes="0;0.04;0.12;0.74;1" dur="4.2s" begin="1.99s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0.16;0" keyTimes="0;0.04;0.14;0.82;1" dur="4.2s" begin="1.99s" repeatCount="indefinite"/>
      </circle>
      <circle cx="124" cy="196" r="3" fill="none" stroke="#fa6c34" stroke-width="1.2" opacity="0">
        <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="1.99s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0;0" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="1.99s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="86" cy="182" r="0" fill="#de5d35" opacity="0">
        <animate attributeName="r" values="0;4.4;3.1;3.1;0" keyTimes="0;0.04;0.12;0.74;1" dur="4.2s" begin="2.52s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0.16;0" keyTimes="0;0.04;0.14;0.82;1" dur="4.2s" begin="2.52s" repeatCount="indefinite"/>
      </circle>
      <circle cx="86" cy="182" r="3" fill="none" stroke="#fa6c34" stroke-width="1.2" opacity="0">
        <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="2.52s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0;0" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="2.52s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="72" cy="100" r="0" fill="#de5d35" opacity="0">
        <animate attributeName="r" values="0;4.4;3.1;3.1;0" keyTimes="0;0.04;0.12;0.74;1" dur="4.2s" begin="3.67s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0.16;0" keyTimes="0;0.04;0.14;0.82;1" dur="4.2s" begin="3.67s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="100" r="3" fill="none" stroke="#fa6c34" stroke-width="1.2" opacity="0">
        <animate attributeName="r" values="3;3;16;16" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="3.67s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0;0" keyTimes="0;0.02;0.3;1" dur="4.2s" begin="3.67s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- footer -->
  <line class="rule" x1="18" y1="236" x2="212" y2="236"/>
  <text class="mono micro" x="18" y="250">AUTHORIZED</text>
  <text class="mono micro" x="212" y="250" text-anchor="end">AES-256-GCM</text>
</svg>
