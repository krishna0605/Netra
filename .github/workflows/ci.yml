name: quality

on:
  push:
    branches: [main]
    tags:
      - "release-candidate-*"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-provenance:
    name: commit-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Require signed Krishna-only commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_commit_provenance.py
          --before "${{ github.event.before }}"
          --after "$GITHUB_SHA"
          --github-repository "$GITHUB_REPOSITORY"

  backend-unit:
    name: backend-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.worker.txt
      - name: Install locked backend dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.worker.txt"
      - name: Install local parser prerequisite
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
      - name: Run Django quality gates
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/ml-services/anomaly-engine
          NETRA_TEST_SQLITE: "1"
          # RLIMIT_NPROC counts every process owned by the shared hosted-runner
          # user, not only Netra's parser child. Keep this CI-only ceiling
          # finite while the dedicated production worker retains its limit of 16.
          NETRA_PARSER_MAX_PROCESSES: "256"
        run: |
          python manage.py test apps.forensics.tests
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py generate_route_policy_inventory --check

  backend-postgres:
    name: backend-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: netra_test
          POSTGRES_USER: netra_test
          POSTGRES_PASSWORD: netra_test_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netra_test -d netra_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.worker.txt
      - run: "python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.worker.txt"
      - name: Prove PostgreSQL-backed invariants
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/ml-services/anomaly-engine
          NETRA_TEST_POSTGRES: "1"
          # Disposable loopback service container only. Hosted deployments keep
          # the default NETRA_DATABASE_SSL_REQUIRED=1, and production refuses to
          # start without it.
          NETRA_DATABASE_SSL_REQUIRED: "0"
          DATABASE_URL: postgresql://netra_test:netra_test_local_only@127.0.0.1:5432/netra_test
        run: >-
          python manage.py test
          apps.forensics.tests.test_postgres_concurrency
          apps.forensics.tests.test_admin_invariants
          apps.forensics.tests.test_admin_console
          apps.forensics.tests.test_admin_audit
          apps.forensics.tests.test_admin_write_path
          apps.forensics.tests.test_permission_resolution
          apps.forensics.tests.test_admin_permissions_api
          apps.forensics.tests.test_live_sessions
          apps.forensics.tests.test_access_log_lifecycle
          apps.forensics.tests.test_user_provisioning
          apps.forensics.tests.test_jwt_verification

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle

  admin-quality:
    name: admin-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_DEPLOYMENT_PROFILE: local
      - run: npm run build
        env:
          # The console refuses to start without these, by design. CI only
          # needs them to be present and correctly named — a build must never
          # carry real values, and these are not real.
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_DEPLOYMENT_PROFILE: local
      - name: No server secret may reach a browser bundle
        working-directory: .
        run: |
          # Anything prefixed VITE_ is compiled into JavaScript every visitor
          # downloads, so a secret committed here is disclosed the moment it
          # builds. Match on secrets being *used*, not merely named — source
          # that names them in order to reject them is exactly what we want.
          failed=0

          # A service key, hardcoded. Both the modern and legacy shapes.
          if grep -rnE 'sb_secret_[A-Za-z0-9_-]{8,}|"role"[[:space:]]*:[[:space:]]*"service_role"' \
               admin/src frontend/src 2>/dev/null; then
            echo "::error::A Supabase secret key literal appears in browser source."
            failed=1
          fi

          # A secret read out of the environment and into the bundle.
          if grep -rnE 'import\.meta\.env\.[A-Za-z_]*(SECRET|SERVICE_ROLE|PRIVATE_KEY)' \
               admin/src frontend/src 2>/dev/null; then
            echo "::error::Browser source reads a server-only environment variable."
            failed=1
          fi

          # A committed env file carrying one.
          for f in $(git ls-files 'admin/.env*' 'frontend/.env*' | grep -v '\.example$'); do
            echo "::error::$f is tracked; local environment files must stay ignored."
            failed=1
          done

          test "$failed" -eq 0 && echo "No server secret reaches browser-bundled source."
          exit "$failed"

  browser-security:
    name: browser-security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:production-smoke
      - run: npm run test:a11y

  migration-and-supabase-lint:
    name: migration-and-supabase-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/lint_supabase_sql.py
      - run: python scripts/validate_workflows.py
      - run: python scripts/validate_github_governance.py
      - run: python scripts/validate_deployment_contract.py

  ci-policy-gate:
    name: ci-policy-gate
    if: always()
    needs: [commit-provenance, backend-unit, backend-postgres, frontend-quality, admin-quality, browser-security, migration-and-supabase-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every quality job
        env:
          COMMIT_PROVENANCE: ${{ needs.commit-provenance.result }}
          BACKEND_UNIT: ${{ needs.backend-unit.result }}
          BACKEND_POSTGRES: ${{ needs.backend-postgres.result }}
          FRONTEND_QUALITY: ${{ needs.frontend-quality.result }}
          ADMIN_QUALITY: ${{ needs.admin-quality.result }}
          BROWSER_SECURITY: ${{ needs.browser-security.result }}
          MIGRATION_LINT: ${{ needs.migration-and-supabase-lint.result }}
        run: test "$COMMIT_PROVENANCE$BACKEND_UNIT$BACKEND_POSTGRES$FRONTEND_QUALITY$ADMIN_QUALITY$BROWSER_SECURITY$MIGRATION_LINT" = "successsuccesssuccesssuccesssuccesssuccesssuccess"
