version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
      frontend-routine:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
      backend-routine:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /sensor-agent
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      sensor-updates:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: tuesday
      time: "04:15"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "04:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      actions-updates:
        patterns: ["*"]
